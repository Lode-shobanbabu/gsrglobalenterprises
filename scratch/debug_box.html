<!DOCTYPE html>
<html>
<body>
<script>
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => {
    const leftCard = document.querySelector('.procurement-image-card');
    const stepLabel = document.querySelector('.procurement-step-label');
    const step1 = document.querySelector('.procurement-step-node-item');
    const timeline = document.querySelector('.procurement-steps-timeline');
    const colLeft = document.querySelector('.col-lg-5');
    const colRight = document.querySelector('.col-lg-7');

    const data = {
      colLeft: colLeft.getBoundingClientRect(),
      colRight: colRight.getBoundingClientRect(),
      leftCard: leftCard.getBoundingClientRect(),
      timeline: timeline.getBoundingClientRect(),
      step1: step1.getBoundingClientRect(),
      stepLabel: stepLabel.getBoundingClientRect()
    };
    
    document.title = JSON.stringify(data);
  }, 300);
});
</script>
</body>
</html>
